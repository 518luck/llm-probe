<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM API Tester</title>
<style>
	  :root {
	    --bg: #f5f5f5;
	    --card: #fff;
	    --border: #e0e0e0;
	    --text: #333;
	    --primary: #4f46e5;
	    --success: #10b981;
	    --error: #ef4444;
	    --muted: #888;
	    --input-bg: #fff;
	    --chip-bg: #eef2ff;
	    --chip-border: #c7d2fe;
	    --result-bg: #1e1e2e;
	    --result-text: #cdd6f4;
	    --hover-bg: #eef2ff;
	    --preset-bg: #fafafa;
	  }
	  [data-theme="dark"] {
	    --bg: #1a1b26;
	    --card: #24283b;
	    --border: #414868;
	    --text: #c0caf5;
	    --primary: #7aa2f7;
	    --success: #9ece6a;
	    --error: #f7768e;
	    --muted: #565f89;
	    --input-bg: #1a1b26;
	    --chip-bg: #1f2335;
	    --chip-border: #3b4261;
	    --result-bg: #0f0f1a;
	    --result-text: #a9b1d6;
	    --hover-bg: #1f2335;
	    --preset-bg: #1f2335;
	  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  h1 small { font-size: 13px; color: var(--muted); font-weight: normal; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--muted); }

  .form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .form-row label { font-size: 13px; min-width: 70px; font-weight: 500; }
  .form-row .flex-1 { flex: 1; min-width: 150px; }

input, textarea, select {
	    padding: 8px 12px;
	    border: 1px solid var(--border);
	    border-radius: 6px;
	    font-size: 13px;
	    font-family: inherit;
	    background: var(--input-bg);
	    color: var(--text);
	    outline: none;
	    transition: border-color 0.15s;
	    width: 100%;
	  }
  input:focus, textarea:focus, select:focus { border-color: var(--primary); }

  textarea { resize: vertical; font-family: 'SF Mono', Monaco, monospace; font-size: 12px; }

  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

  .headers-list { margin: 8px 0; }
  .header-item {
    display: flex; gap: 6px; align-items: center; margin-bottom: 4px;
  }
  .header-item input { flex: 1; }
  .header-item .btn-remove {
    background: none; border: none; color: var(--error); cursor: pointer; font-size: 18px; padding: 4px;
  }
  .btn-add-header { font-size: 12px; color: var(--primary); cursor: pointer; background: none; border: none; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 8px 16px; cursor: pointer; font-size: 13px; border: none;
    background: none; color: var(--muted); border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .msg-row {
    display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start;
  }
  .msg-row .role-select { width: 100px; }
  .msg-row textarea { flex: 1; }
  .msg-row .btn-remove { background: none; border: none; color: var(--error); cursor: pointer; font-size: 18px; padding: 4px; margin-top: 4px; }

.result-box {
	    background: var(--result-bg);
	    color: var(--result-text);
    border-radius: 8px;
    padding: 14px;
    font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
    font-size: 12px;
    line-height: 1.6;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 500px;
    overflow-y: auto;
    margin-top: 8px;
  }
  .result-box .success { color: #a6e3a1; }
  .result-box .error { color: #f38ba8; }
  .result-box .key { color: #89b4fa; }
  .result-box .string { color: #a6e3a1; }
  .result-box .number { color: #fab387; }
  .result-box .bool { color: #cba6f7; }
  .result-box .null { color: #6c7086; }

  .status-bar {
    display: flex; gap: 12px; align-items: center; margin-top: 8px; font-size: 12px;
  }
  .status-bar .spinner { display: none; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-bar.loading .spinner { display: inline-block; }
  .status-text { color: var(--muted); }
  .status-text.success { color: var(--success); }
  .status-text.error { color: var(--error); }

  .model-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.model-chip {
	    padding: 4px 10px; border-radius: 14px; font-size: 12px;
	    background: var(--chip-bg); color: var(--primary); border: 1px solid var(--chip-border);
	  }
  .model-chip .endpoint-type {
    font-size: 10px; color: var(--muted); margin-left: 4px;
  }

.preset-btn {
	    font-size: 11px; padding: 3px 8px; border-radius: 4px;
	    border: 1px solid var(--border); background: var(--preset-bg); cursor: pointer;
	  }
	  .preset-btn:hover { background: var(--hover-bg); border-color: var(--primary); }

  .inline-flex { display: flex; gap: 8px; align-items: center; }

	  .theme-toggle {
	    background: none; border: 1px solid var(--border); border-radius: 20px;
	    cursor: pointer; font-size: 16px; padding: 4px 10px;
	    color: var(--text); margin-left: auto; transition: all 0.2s;
	    display: flex; align-items: center; gap: 4px;
	  }
	  .theme-toggle:hover { border-color: var(--primary); background: var(--hover-bg); }
	  .theme-toggle span { font-size: 12px; }
</style>
</head>
<body>
<div class="container">
<h1>
	    🧪 LLM API Tester
	    <small>快速测试 LLM API 连通性</small>
	    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题">🌙 <span>深色</span></button>
	  </h1>

  <!-- 基础配置 -->
  <div class="card">
    <div class="card-title">🔌 连接配置</div>
    <div class="form-row">
      <label>API URL</label>
      <div class="flex-1 inline-flex">
        <input id="apiUrl" value="https://agentrouter.org/v1" placeholder="https://example.com/v1" style="flex:1">
        <button class="preset-btn" onclick="setPreset('agentrouter')">AgentRouter</button>
        <button class="preset-btn" onclick="setPreset('custom')">自定义</button>
      </div>
    </div>
    <div class="form-row">
      <label>API Key</label>
      <div class="flex-1">
        <input id="apiKey" placeholder="sk-..." value="">
      </div>
    </div>
    <div class="form-row" style="align-items:flex-start">
      <label>请求头</label>
      <div class="flex-1">
        <div class="headers-list" id="headersList">
          <div class="header-item">
            <input class="header-key" value="User-Agent" placeholder="Header">
            <input class="header-value" value="QwenCode/1.0.0" placeholder="Value">
            <button class="btn-remove" onclick="this.parentElement.remove()">×</button>
          </div>
        </div>
        <button class="btn-add-header" onclick="addHeader()">+ 添加请求头</button>
      </div>
    </div>
  </div>

  <!-- 操作区 -->
  <div class="card">
    <div class="tabs">
      <button class="tab active" data-tab="test" onclick="switchTab('test')">📤 发送测试</button>
      <button class="tab" data-tab="models" onclick="switchTab('models')">📋 查看模型</button>
    </div>

    <!-- Tab: 发送测试 -->
    <div class="tab-content active" id="tab-test">
      <div class="form-row">
        <label>模型</label>
        <div class="flex-1 inline-flex">
          <input id="testModel" value="gpt-5.5" placeholder="model id" style="flex:1">
          <button class="preset-btn" onclick="document.getElementById('testModel').value='gpt-5.5'">gpt-5.5</button>
          <button class="preset-btn" onclick="document.getElementById('testModel').value='claude-opus-4-6'">opus-4-6</button>
          <button class="preset-btn" onclick="document.getElementById('testModel').value='glm-5.2'">glm-5.2</button>
        </div>
      </div>
      <div class="form-row" style="align-items:flex-start">
        <label>消息</label>
        <div class="flex-1">
          <div id="messagesList">
            <div class="msg-row">
              <select class="role-select">
                <option value="user" selected>user</option>
                <option value="system">system</option>
                <option value="assistant">assistant</option>
              </select>
              <textarea rows="2" placeholder="消息内容">hi</textarea>
              <button class="btn-remove" onclick="this.parentElement.remove()">×</button>
            </div>
          </div>
          <button class="btn-add-header" onclick="addMessage()">+ 添加消息</button>
        </div>
      </div>
      <div class="form-row">
        <label>Stream</label>
        <div class="flex-1">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px">
            <input type="checkbox" id="testStream"> 启用 streaming
          </label>
        </div>
      </div>
      <div class="form-row">
        <label>最大 Token</label>
        <div class="flex-1">
          <input id="testMaxTokens" type="number" value="100" style="width:120px">
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn btn-primary" onclick="sendTest()">🚀 发送请求</button>
        <button class="btn btn-outline" onclick="clearResult()">清除</button>
      </div>
    </div>

    <!-- Tab: 查看模型 -->
    <div class="tab-content" id="tab-models">
      <button class="btn btn-success" onclick="listModels()">📋 获取模型列表</button>
      <div id="modelListContainer" class="model-list"></div>
    </div>
  </div>

  <!-- 结果区 -->
  <div class="card">
    <div class="card-title">📦 响应</div>
    <div class="status-bar" id="statusBar">
      <span class="spinner"></span>
      <span class="status-text" id="statusText">就绪</span>
      <span id="metaInfo" style="color:var(--muted);font-size:11px"></span>
    </div>
    <div class="result-box" id="resultBox">等待发送请求...</div>
  </div>
</div>

<script>
// ====== 预设 ======
function setPreset(name) {
  if (name === 'agentrouter') {
    document.getElementById('apiUrl').value = 'https://agentrouter.org/v1';
    setHeaders([{ k: 'User-Agent', v: 'QwenCode/1.0.0' }]);
  } else {
    document.getElementById('apiUrl').value = '';
    setHeaders([]);
  }
}

function setHeaders(arr) {
  const container = document.getElementById('headersList');
  container.innerHTML = '';
  if (arr.length === 0) addHeader();
  else arr.forEach(h => addHeader(h.k, h.v));
}

function addHeader(k, v) {
  const container = document.getElementById('headersList');
  const div = document.createElement('div');
  div.className = 'header-item';
  div.innerHTML = `
    <input class="header-key" value="${k || ''}" placeholder="Header">
    <input class="header-value" value="${v || ''}" placeholder="Value">
    <button class="btn-remove" onclick="this.parentElement.remove()">×</button>
  `;
  container.appendChild(div);
}

function addMessage(role, content) {
  const container = document.getElementById('messagesList');
  const div = document.createElement('div');
  div.className = 'msg-row';
  div.innerHTML = `
    <select class="role-select">
      <option value="user" ${role === 'system' ? '' : 'selected'}>user</option>
      <option value="system" ${role === 'system' ? 'selected' : ''}>system</option>
      <option value="assistant" ${role === 'assistant' ? 'selected' : ''}>assistant</option>
    </select>
    <textarea rows="2" placeholder="消息内容">${content || ''}</textarea>
    <button class="btn-remove" onclick="this.parentElement.remove()">×</button>
  `;
  container.appendChild(div);
}

// ====== Tab 切换 ======
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.toggle('active', t.id === 'tab-' + name));
}

// ====== 通过本地服务端代理发送请求 ======
async function proxyRequest(url, method, headers, body) {
  const resp = await fetch('/api/proxy', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url, method, headers, requestBody: body ? JSON.stringify(body) : null })
  });
  return await resp.json();
}

function getConfig() {
  const url = document.getElementById('apiUrl').value.replace(/\/+$/, '');
  const key = document.getElementById('apiKey').value;
  const headers = {};
  document.querySelectorAll('.header-item').forEach(item => {
    const k = item.querySelector('.header-key').value.trim();
    const v = item.querySelector('.header-value').value.trim();
    if (k) headers[k] = v;
  });
  if (key) headers['Authorization'] = 'Bearer ' + key;
  return { url, key, headers };
}

function setStatus(text, type) {
  const bar = document.getElementById('statusBar');
  const el = document.getElementById('statusText');
  el.textContent = text;
  el.className = 'status-text' + (type ? ' ' + type : '');
  bar.classList.toggle('loading', type === 'loading');
}

// ====== 模型列表 ======
async function listModels() {
  const cfg = getConfig();
  if (!cfg.url) { setStatus('请填写 API URL', 'error'); return; }
  setStatus('获取模型列表中...', 'loading');

  try {
    // 先试 /models
    let result = await proxyRequest(cfg.url + '/models', 'GET', cfg.headers, null);
    let data = result.data;

    // 如果失败，试 /v1/models
    if (!data || !data.data) {
      const baseUrl = cfg.url.replace(/\/v1\/?$/, '');
      result = await proxyRequest(baseUrl + '/v1/models', 'GET', cfg.headers, null);
      data = result.data;
    }

    const models = data?.data || data?.models || [];
    const container = document.getElementById('modelListContainer');
    if (models.length === 0) {
      container.innerHTML = '<div style="color:var(--muted);font-size:13px">未找到模型列表</div>';
    } else {
      container.innerHTML = models.map(m => `
        <span class="model-chip" onclick="document.getElementById('testModel').value='${m.id}'" style="cursor:pointer" title="点击填入测试框">
          ${m.id}
          ${m.supported_endpoint_types ? m.supported_endpoint_types.map(t => `<span class="endpoint-type">${t}</span>`).join('') : ''}
        </span>
      `).join('');
    }
    setStatus(`获取成功，共 ${models.length} 个模型`, 'success');
    showResult(data);
  } catch (e) {
    setStatus('获取失败: ' + e.message, 'error');
  }
}

// ====== 发送测试 ======
async function sendTest() {
  const cfg = getConfig();
  if (!cfg.url) { setStatus('请填写 API URL', 'error'); return; }

  const model = document.getElementById('testModel').value.trim();
  if (!model) { setStatus('请填写模型名称', 'error'); return; }

  const messages = [];
  document.querySelectorAll('#messagesList .msg-row').forEach(row => {
    const role = row.querySelector('.role-select').value;
    const content = row.querySelector('textarea').value.trim();
    if (content) messages.push({ role, content });
  });
  if (messages.length === 0) { setStatus('请至少输入一条消息', 'error'); return; }

  const stream = document.getElementById('testStream').checked;
  const maxTokens = parseInt(document.getElementById('testMaxTokens').value) || 100;

  const body = { model, messages, max_tokens: maxTokens, stream };

  setStatus('发送请求中...', 'loading');
  document.getElementById('metaInfo').textContent = '';
  showResult('请求中...');

  const baseUrl = cfg.url.replace(/\/+$/, '');
  const url = baseUrl + '/chat/completions';

  try {
    const result = await proxyRequest(url, 'POST', cfg.headers, body);
    const { status, data } = result;

    if (status >= 200 && status < 300) {
      formatAndShowResult(data, model);
      setStatus('✅ 请求成功', 'success');
      const usage = data.usage;
      if (usage) {
        document.getElementById('metaInfo').textContent =
          `输入: ${usage.prompt_tokens || '-'} | 输出: ${usage.completion_tokens || '-'} | 总计: ${usage.total_tokens || '-'}`;
      }
    } else {
      showResult(data);
      setStatus(`❌ ${status} ${data?.error?.message || data?.error || '请求失败'}`, 'error');
    }
  } catch (e) {
    setStatus('❌ 请求失败: ' + e.message, 'error');
    showResult({ error: e.message });
  }
}

// ====== 格式化结果 ======
function showResult(data) {
  if (typeof data === 'string') {
    document.getElementById('resultBox').textContent = data;
  } else {
    document.getElementById('resultBox').innerHTML = syntaxHighlight(data);
  }
}

function formatAndShowResult(data, model) {
  const result = {
    model: data.model || model,
    content: data.choices?.[0]?.message?.content || '',
    finish_reason: data.choices?.[0]?.finish_reason || '',
    usage: data.usage || null
  };
  document.getElementById('resultBox').innerHTML = syntaxHighlight(result);
}

function clearResult() {
  document.getElementById('resultBox').textContent = '等待发送请求...';
  document.getElementById('statusText').textContent = '就绪';
  document.getElementById('statusText').className = 'status-text';
  document.getElementById('metaInfo').textContent = '';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function syntaxHighlight(obj) {
  const json = JSON.stringify(obj, null, 2);
  return json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"([^"]+)":/g, '<span class="key">"$1"</span>:')
    .replace(/: "([^"]*)"/g, ': <span class="string">"$1"</span>')
    .replace(/: (\d+\.?\d*)/g, ': <span class="number">$1</span>')
    .replace(/: (true|false)/g, ': <span class="bool">$1</span>')
    .replace(/: (null)/g, ': <span class="null">$1</span>');
}
// ====== 主题切换 ======
	function toggleTheme() {
	  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
	  const newTheme = isDark ? 'light' : 'dark';
	  document.documentElement.setAttribute('data-theme', newTheme);
	  localStorage.setItem('llm-tester-theme', newTheme);
	  updateThemeButton(newTheme);
	}

	function updateThemeButton(theme) {
	  const btn = document.getElementById('themeToggle');
	  if (theme === 'dark') {
	    btn.innerHTML = '☀️ <span>浅色</span>';
	  } else {
	    btn.innerHTML = '🌙 <span>深色</span>';
	  }
	}

	// 初始化主题
	(function initTheme() {
	  const saved = localStorage.getItem('llm-tester-theme');
	  if (saved === 'dark') {
	    document.documentElement.setAttribute('data-theme', 'dark');
	    updateThemeButton('dark');
	  } else {
	    // 跟随系统偏好
	    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches && !saved) {
	      document.documentElement.setAttribute('data-theme', 'dark');
	      updateThemeButton('dark');
	    }
	  }
	})();
	</script>
</body>
</html>
